[package]
name = "lecteur-hd60"
version = "0.3.0"
edition = "2021"
description = "Lecteur faible latence (image + son) pour carte de capture USB, affichage GPU"

[dependencies]
nokhwa = { version = "0.10", features = ["input-native"] }
cpal = "0.15"
winit = "0.30"
wgpu = "24"
pollster = "0.4"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Media", "Win32_System_Threading", "Win32_System_Registry"] }

[build-dependencies]
embed-resource = "3.0.12"
